<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- DOCX box -->
  <rect x="40" y="40" width="260" height="160" rx="8" ry="8" fill="#f7f9fb" stroke="#2b6cb0" stroke-width="3" />
  <text x="170" y="70" font-family="Arial" font-size="18" text-anchor="middle" fill="#2b6cb0">Generated DOCX</text>
  <rect x="60" y="90" width="220" height="80" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <text x="170" y="120" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Report content (tables, text, images)</text>
  <!-- Arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568" />
    </marker>
  </defs>
  <line x1="320" y1="120" x2="420" y2="120" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)" />
  <!-- PDF box -->
  <rect x="420" y="40" width="260" height="160" rx="8" ry="8" fill="#fff5f5" stroke="#c53030" stroke-width="3" />
  <text x="550" y="70" font-family="Arial" font-size="18" text-anchor="middle" fill="#c53030">Converted PDF</text>
  <g transform="translate(460,100)">
    <rect width="180" height="60" fill="#ffffff" stroke="#fed7d7" rx="4"/>
    <text x="90" y="28" font-family="Arial" font-size="12" text-anchor="middle" fill="#742a2a">PDF-ready for printing / archiving</text>
  </g>
  <!-- Footer note -->
  <text x="400" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#718096">Replace with real screenshots or an animated GIF for a live demo</text>
</svg>
