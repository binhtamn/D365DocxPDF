<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- Step 1 -->
  <rect x="24" y="32" width="160" height="96" rx="8" fill="#f0f9ff" stroke="#2b6cb0" />
  <text x="104" y="72" font-family="Arial" font-size="13" text-anchor="middle" fill="#2b6cb0">1. D365 X++</text>
  <!-- Arrow 1 -->
  <line x1="200" y1="80" x2="320" y2="80" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="320" y="32" width="160" height="96" rx="8" fill="#f7fff0" stroke="#38a169" />
  <text x="400" y="72" font-family="Arial" font-size="13" text-anchor="middle" fill="#276749">2. Generate DOCX</text>
  <!-- Arrow 2 -->
  <line x1="480" y1="80" x2="600" y2="80" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="600" y="32" width="160" height="96" rx="8" fill="#fff7ed" stroke="#dd6b20" />
  <text x="680" y="72" font-family="Arial" font-size="13" text-anchor="middle" fill="#8a3e02">3. Convert to PDF</text>
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568" />
    </marker>
  </defs>
  <!-- Storage/Delivery note -->
  <text x="400" y="140" font-family="Arial" font-size="11" text-anchor="middle" fill="#4a5568">Store or deliver PDF (SharePoint, email, archive) — avoid Office Automation on server</text>
</svg>
